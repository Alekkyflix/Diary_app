{% extends "layouts/floating_layout.html" %}

{% block content %}
<div class="dashboard-header" style="margin-bottom: 30px;">
    <h2>Welcome back, <span class="text-accent">{{ current_user.username }}</span></h2>
    <p style="color: var(--text-secondary);">Here is your daily snapshot.</p>
</div>

<!-- Widgets Grid -->
<div class="widgets-grid"
    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
    <!-- Mood Widget -->
    <div class="glass-panel" style="padding: 20px; text-align: center;">
        <i class="fas fa-smile text-accent" style="font-size: 2em; margin-bottom: 10px;"></i>
        <h3>Mood</h3>
        <p>Feeling Great</p>
    </div>
    <!-- Sleep Widget -->
    <div class="glass-panel" style="padding: 20px; text-align: center;">
        <i class="fas fa-bed text-accent" style="font-size: 2em; margin-bottom: 10px;"></i>
        <h3>Sleep</h3>
        <p>7h 30m</p>
    </div>
    <!-- Helpline Widget -->
    <div class="glass-panel" style="padding: 20px; text-align: center; border-color: #FF5F56;">
        <i class="fas fa-phone-alt" style="color: #FF5F56; font-size: 2em; margin-bottom: 10px;"></i>
        <h3>Helpline</h3>
        <p style="font-size: 0.8em;">1190 (Kenyan Red Cross)</p>
    </div>
</div>

<!-- Recent Entries -->
<h3 style="margin-bottom: 20px;">Recent Entries</h3>
<div class="entries-list">
    <!-- Placeholder for loop -->
    <div class="glass-panel" style="padding: 20px; margin-bottom: 15px; cursor: pointer;">
        <div style="display: flex; justify-content: space-between;">
            <span style="font-weight: bold;">Deep Thoughts</span>
            <span style="color: gray; font-size: 0.9em;">Oct 24, 2025</span>
        </div>
        <p style="color: gray; margin-top: 10px;">Today I realized that...</p>
    </div>
</div>
{% endblock %}
