{% extends "layouts/base.html" %}

{% block layout_content %}
<div style="height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column;">
    <h1 class="text-accent" style="font-size: 3em; margin-bottom: 20px;">Diary OS</h1>
    <div class="loader"
        style="width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite;">
    </div>

    <script>
        // Redirect after 3 seconds
        setTimeout(() => {
            window.location.href = "{{ url_for('auth.login') }}";
        }, 3000);
    </script>
</div>
<style>
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}
