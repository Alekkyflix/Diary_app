<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Diary</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Dynamic Layout styles can go here */
    </style>
</head>

<body>

    <div class="app-container" id="appRoot">
        <!-- Pseudo Window Header -->
        <div class="window-header">
            <div class="window-controls">
                <button class="control-btn btn-close" onclick="exitApp()"></button>
                <button class="control-btn btn-min" onclick="toggleMinimize()"></button>
                <button class="control-btn btn-max" onclick="toggleMaximize()"></button>
            </div>
            <div class="app-title">My Private Space</div>
            <div class="window-actions">
                <i class="fas fa-cog"></i>
            </div>
        </div>

        <!-- Content Injection -->
        {% block layout_content %}{% endblock %}

    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        function exitApp() {
            window.location.href = "{{ url_for('main.exit_app') }}";
        }

        function toggleMinimize() {
            document.getElementById('appRoot').classList.toggle('jiggly');
            setTimeout(() => {
                document.getElementById('appRoot').classList.remove('jiggly');
            }, 500);
        }
    </script>
</body>

</html>
