{% extends "layouts/base.html" %}

{% block layout_content %}
<div class="layout-floating" style="display: flex; height: 100%; gap: 20px; padding: 0 20px 20px 20px;">
    <!-- Floating Sidebar -->
    <aside class="glass-panel" style="width: 250px; padding: 20px; display: flex; flex-direction: column;">
        <nav>
            <ul style="list-style: none; padding: 0;">
                <li style="margin-bottom: 15px;"><a href="{{ url_for('main.index') }}" class="text-accent"><i
                            class="fas fa-home"></i> Home</a></li>
                <li style="margin-bottom: 15px;"><a href="{{ url_for('entries.add_entry') }}"
                        style="color: white; text-decoration: none;"><i class="fas fa-pen-fancy"></i> New Entry</a></li>
                <li style="margin-bottom: 15px;"><a href="#" style="color: white; text-decoration: none;"><i
                            class="fas fa-heartbeat"></i> Health</a></li>
                <li style="margin-bottom: 15px;"><a href="{{ url_for('auth.logout') }}"
                        style="color: white; text-decoration: none;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <div style="margin-top: auto;">
            <div class="daily-quote" style="font-size: 0.8em; color: gray;">
                "Keep going."
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="glass-panel" style="flex: 1; padding: 30px; overflow-y: auto;">
        {% block content %}{% endblock %}
    </main>
</div>
{% endblock %}
